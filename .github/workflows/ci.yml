name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install doc tools
        run: npm ci
        working-directory: .

      - name: Lint Markdown (markdownlint)
        run: npm run docs:lint
        working-directory: .

      - name: Check links
        run: npm run docs:linkcheck
        working-directory: .
        continue-on-error: true

      - name: Spell check
        run: npm run docs:spellcheck
        working-directory: .
        continue-on-error: true

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  build-go:
    name: Build Go (Linux AMD64)
    runs-on: ubuntu-latest
    needs: [lint-go, test-go, build-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: wails build -platform linux/amd64
        env:
          CGO_ENABLED: 1

      - name: Verify binary
        run: |
          ls -la build/bin/
          ./build/bin/mdman --version || true